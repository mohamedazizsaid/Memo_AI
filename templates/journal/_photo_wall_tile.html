{% comment %}
One animated tile of the home page memory wall. Kept in its own partial so the
initial page and the infinite-scroll JSON endpoint render the exact same markup.
{% endcomment %}
<figure class="photo-tile photo-tile--{{ photo.wall_tile }}{% if photo.wall_tagged %} is-tagged{% endif %}"
        data-column="{{ photo.wall_column }}"
        data-photo-index="{{ photo.wall_index }}"
        data-photo-src="{{ photo.large_url }}"
        data-photo-thumb="{{ photo.thumb_url }}"
        data-photo-title="{{ photo.title|default:'' }}"
        data-photo-date="{{ photo.date_label }}"
        data-photo-number="{{ photo.number }}"
        style="--tile-delay: {{ photo.wall_delay }}ms;">
  <span class="photo-tile__media">
    <img src="{{ photo.thumb_url }}" alt="{{ photo.title|default:photo.date_label }}" loading="lazy" decoding="async">
  </span>
  <span class="photo-tile__shine" aria-hidden="true"></span>
  {% if photo.kind != 'photo' %}
  <span class="photo-tile__kind">
    {% if photo.kind == 'illustration' %}{% trans_text "Illustration IA" "AI illustration" %}{% else %}{% trans_text "Portrait" "Portrait" %}{% endif %}
  </span>
  {% endif %}
  <figcaption class="photo-tile__tag">
    <span>{{ photo.date_label }}</span>
  </figcaption>
  <button type="button" class="photo-tile__select" data-photo-select aria-pressed="false"
          aria-label="{% trans_text 'Sélectionner cette photo pour le reel' 'Select this photo for the reel' %}">
    <span class="photo-tile__select-box" aria-hidden="true">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <path d="M2.5 7.2 5.6 10.3 11.5 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  {% if photo.entry_id %}
  <a class="photo-tile__link" href="/journal/{{ photo.entry_id }}/"
     aria-label="{% trans_text 'Ouvrir le souvenir' 'Open the memory' %} : {{ photo.title|default:photo.date_label }}"></a>
  {% endif %}
</figure>
