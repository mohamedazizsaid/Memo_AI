{% extends 'base.html' %}
{% block title %}{% if person %}Modifier{% else %}Ajouter{% endif %} une personne — MemoAI{% endblock %}

{% block content %}
<div class="container container--narrow">
  <div class="page-header">
    <div>
      <p class="eyebrow">PERSONNES</p>
      <h1 class="page-title">{% if person %}Modifier {{ person.name }}{% else %}Ajouter une personne{% endif %}</h1>
    </div>
    <a href="/personnes/" class="btn btn-ghost">Annuler</a>
  </div>

  <div class="card">
    <form method="post" action="" id="person-form" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_name" class="form-label">Nom</label>
        <input type="text" name="name" id="id_name" class="form-input"
          placeholder="Nom de la personne" value="{{ person.name|default:'' }}" required>
      </div>

      <div class="form-group">
        <label for="id_avatar_url" class="form-label">Photo (URL) <span class="form-optional">(optionnel)</span></label>
        <input type="url" name="avatar_url" id="id_avatar_url" class="form-input"
          placeholder="https://..." value="{{ person.avatar_url|default:'' }}">
      </div>

      <div class="form-group">
        <label for="id_notes" class="form-label">Notes <span class="form-optional">(optionnel)</span></label>
        <textarea name="notes" id="id_notes" class="form-textarea" rows="4"
          placeholder="Notes sur cette personne...">{{ person.notes|default:'' }}</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-person">
          {% if person %}Enregistrer{% else %}Ajouter{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
