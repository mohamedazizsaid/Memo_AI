<!DOCTYPE html>
<html lang="{{ lang|default:'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ strings.title }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f4f1;font-family:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0d0d0d;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f1;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid rgba(13,13,13,0.10);border-radius:24px;overflow:hidden;">
          <tr>
            <td style="padding:36px 40px 8px;">
              <div style="font-size:13px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#0d0d0d;">MemoAI</div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 40px 0;">
              <h1 style="margin:0;font-size:24px;line-height:1.2;letter-spacing:-0.02em;font-weight:600;color:#0d0d0d;">{{ strings.title }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 0;font-size:15px;line-height:1.6;color:#4a4744;">
              <p style="margin:0 0 12px;">{{ strings.hello }} {{ user.first_name|default:user.email }},</p>
              <p style="margin:0 0 8px;">{{ strings.intro }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 40px 6px;" align="left">
              <a href="{{ reset_url }}" style="display:inline-block;background:#0d0d0d;color:#ffffff;text-decoration:none;font-size:15px;font-weight:500;padding:14px 26px;border-radius:999px;">{{ strings.cta }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 40px 0;font-size:13px;line-height:1.6;color:#8a8784;">
              <p style="margin:0 0 10px;">{{ strings.expiry }} {{ strings.ignore }}</p>
              <p style="margin:0 0 4px;">{{ strings.fallback }}</p>
              <p style="margin:0;word-break:break-all;"><a href="{{ reset_url }}" style="color:#0d0d0d;">{{ reset_url }}</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 40px 36px;font-size:12px;color:#a8a5a2;">© {% now "Y" %} MemoAI — {{ site_name }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
