# ============================================================
# MemoAI — CI/CD Pipeline (GitHub Actions)
# ============================================================
# Déclenché sur :
#   - Push sur `main` → tests + build Docker + deploy Render
#   - Push sur `aziz` ou toute PR → tests uniquement
#   - Workflow manuel (workflow_dispatch)
# ============================================================

name: 🚀 MemoAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/memoai
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ────────────────────────────────────────────────────────────
# JOB 1 — Tests & Linting
# ────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🧪 Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memoai_test
          POSTGRES_USER: memoai_user
          POSTGRES_PASSWORD: memoai_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      USE_SQLITE: "False"
      DB_ENGINE: postgresql
      DB_NAME: memoai_test
      DB_USER: memoai_user
      DB_PASSWORD: memoai_password
      DB_HOST: localhost
      DB_PORT: "5432"
      USE_REDIS: "False"
      CELERY_ALWAYS_EAGER: "True"
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: test_secret
      GEMINI_API_KEY: test_key
      HUGGINGFACE_API_KEY: test_key
      AI_MOCK_MODE: "True"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      FRONTEND_URL: "http://localhost:8000"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Install system and python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint with ruff (if available)
        run: |
          pip install ruff 2>/dev/null || true
          ruff check . --select E,F,W --ignore E501 2>/dev/null || echo "Ruff check skipped"
        continue-on-error: true

      - name: 🗄️ Run Django migrations
        run: python manage.py migrate --noinput

      - name: ✅ Run tests
        run: |
          pytest tests/ -v \
            --tb=short \
            --no-header \
            -q \
            2>/dev/null || python manage.py test --verbosity=2

      - name: 🔒 Django system checks
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker Image (main uniquement)
  # ────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Render (main uniquement)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: 🚀 Trigger Render deploy hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
              -H "Content-Type: application/json" \
              --fail-with-body
            echo "✅ Render deploy triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL not set — skipping auto-deploy"
          fi

      - name: 📢 Notify deployment
        if: success()
        run: |
          echo "🎉 MemoAI deployed successfully!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
