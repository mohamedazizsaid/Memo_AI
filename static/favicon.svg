<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .tile {
        fill: #fdfcfb;
        stroke: #e6e2dc;
        stroke-width: 1.5;
        rx: 14;
      }
      .dot {
        fill: #181715;
      }
      @media (prefers-color-scheme: dark) {
        .tile {
          fill: #1c1a17;
          stroke: #2e2a25;
        }
        .dot {
          fill: #f5f2eb;
        }
      }
    </style>
  </defs>

  <!-- Squircle container tile for tab contrast -->
  <rect class="tile" x="2" y="2" width="60" height="60" rx="14" />

  <!-- 3x3 Dot cluster (center dot omitted) -->
  <!-- Row 1 -->
  <circle class="dot" cx="20" cy="20" r="4.2" />
  <circle class="dot" cx="32" cy="20" r="4.2" />
  <circle class="dot" cx="44" cy="20" r="4.2" />

  <!-- Row 2 -->
  <circle class="dot" cx="20" cy="32" r="4.2" />
  <!-- Center is empty/hidden -->
  <circle class="dot" cx="44" cy="32" r="4.2" />

  <!-- Row 3 -->
  <circle class="dot" cx="20" cy="44" r="4.2" />
  <circle class="dot" cx="32" cy="44" r="4.2" />
  <circle class="dot" cx="44" cy="44" r="4.2" />
</svg>
